apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: qwen-pretrain-cluster
  namespace: default
  labels:
    kai.scheduler/queue: qwen-pretrain-queue
spec:
  rayVersion: '2.9.0'
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-gpus: "0"
    template:
      metadata:
        labels:
          kai.scheduler/queue: qwen-pretrain-queue
      spec:
        containers:
          - name: ray-head
            image: nvcr.io/nvidia/nemo:26.04
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            ports:
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
              - containerPort: 6379
                name: gcs-server
            env:
              - name: NCCL_SOCKET_IFNAME
                value: "eth0"
              - name: HF_HOME
                value: "/workspace/cache"
            resources:
              limits:
                cpu: "8"
                memory: "32Gi"
              requests:
                cpu: "8"
                memory: "32Gi"
            volumeMounts:
              - mountPath: /workspace
                name: host-storage-volume
        volumes:
          - name: host-storage-volume
            hostPath:
              path: /mnt/data/training
              type: DirectoryOrCreate
  workerGroupSpecs:
    - groupName: h100-gpu-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 8
      rayStartParams: {}
      template:
        metadata:
          labels:
            kai.scheduler/queue: qwen-pretrain-queue
        spec:
          hostIPC: true
          containers:
            - name: ray-worker
              image: nvcr.io/nvidia/nemo:26.04
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
              env:
                - name: CUDA_DEVICE_MAX_CONNECTIONS
                  value: "1"
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: "0"
                - name: OMP_NUM_THREADS
                  value: "1"
                - name: MKL_NUM_THREADS
                  value: "1"
                - name: NCCL_SOCKET_IFNAME
                  value: "eth0"
                - name: HF_HOME
                  value: "/workspace/cache"
              resources:
                limits:
                  nvidia.com/gpu: "8"
                  cpu: "96"
                  memory: "800Gi"
                requests:
                  nvidia.com/gpu: "8"
                  cpu: "96"
                  memory: "800Gi"
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: /workspace
                  name: host-storage-volume
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: "256Gi"
            - name: host-storage-volume
              hostPath:
                path: /mnt/data/training
                type: DirectoryOrCreate
